name: Build HomeView Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web Assets into Android APK
        run: |
          mkdir -p app/src/main/assets
          cp index.html manifest.json app/src/main/assets/

      - name: Build Release & Debug APK
        run: |
          gradle assembleRelease assembleDebug
          cp app/build/outputs/apk/release/app-release.apk HomeView-Tablet.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeView-Tablet-APK
          path: HomeView-Tablet.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HomeView Tablette APK v1.0.${{ github.run_number }}"
          body: "Téléchargez `HomeView-Tablet.apk` directement sur votre tablette Android pour installer le HomeView."
          files: HomeView-Tablet.apk
